
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY IDOL CLUB ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;color:#72566b;background:linear-gradient(135deg,#fff0f7,#eaf8ff)}
header{text-align:center;padding:25px 10px;background:#fff9}
h1{color:#df75ad;margin:0}
nav{display:flex;gap:7px;overflow-x:auto;padding:12px;background:#fff;position:sticky;top:0}
button{border:0;border-radius:20px;padding:11px 15px;background:#f7c8df;color:#8d416d;font-weight:bold;cursor:pointer}
nav button{white-space:nowrap}
nav button.active,.primary{background:#df75ad;color:white}
main{max-width:700px;margin:auto;padding:15px}
.panel{background:#ffffffeb;border:1px solid #f5d3e5;border-radius:20px;padding:18px;margin-bottom:15px}
h2{color:#d75d9e}
input,textarea{display:block;width:100%;padding:12px;border:1px solid #edc4db;border-radius:12px;margin:8px 0 14px;font:inherit}
textarea{min-height:100px}
.hidden{display:none!important}
.prize{padding:12px;margin:8px 0;border-radius:14px;background:#fff0f7}
.scratch{height:220px;position:relative;overflow:hidden;border-radius:15px;border:2px solid #f3c6df;background:#fff}
.result{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#fff,#eaf7ff);color:#d75d9e;font-weight:bold;font-size:23px}
#cover{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.note{font-size:12px;color:#927b8c}
</style>
</head>
<body>
<header>
<h1>MY IDOL CLUB ♡</h1>
<p>きらきら推し活しよう 🎀</p>
</header>

<nav>
<button class="active" data-page="home">HOME</button>
<button data-page="prizes">景品一覧</button>
<button data-page="contact">お問い合わせ</button>
<button data-page="history">抽選履歴</button>
<button data-page="admin">管理人限定</button>
</nav>

<main>
<section class="page" id="home">
<div class="panel">
<h2>SCRATCH LOTTERY ♡</h2>
<label>ニックネーム</label>
<input id="nickname" maxlength="30" placeholder="ニックネーム">
<div class="scratch">
<div class="result">
<div>🎀 SCRATCH RESULT 🎀</div>
<div id="result">こすってね ♡</div>
<small id="sub">指で銀色の部分を削ってね</small>
</div>
<canvas id="cover"></canvas>
</div>
<p class="note">※デモ用のスクラッチです。実際のお金や景品の授受はありません。</p>
<button class="primary" id="reset">もう一度スクラッチ</button>
<p id="status" role="status">準備できたよ ♡</p>
</div>
</section>

<section class="page hidden" id="prizes">
<div class="panel"><h2>景品一覧 ♡</h2><div id="prizeList"></div></div>
</section>

<section class="page hidden" id="contact">
<div class="panel">
<h2>お問い合わせ ♡</h2>
<label>お名前</label><input id="contactName" maxlength="50">
<label>メッセージ</label><textarea id="message" maxlength="1000"></textarea>
<button class="primary" id="send">送信する</button>
<p id="contactStatus" class="note"></p>
</div>
</section>

<section class="page hidden" id="history">
<div class="panel"><h2>抽選履歴 ♡</h2><div id="historyList"></div></div>
</section>

<section class="page hidden" id="admin">
<div class="panel">
<h2>管理人限定 ♡</h2>
<p class="note">下の変更はこの端末だけに保存されます。スプレッドシート連携は別途必要です。</p>
<label>景品名</label><input id="pname" placeholder="景品名">
<label>確率（%）</label><input id="prob" type="number" min="0" max="100" value="5">
<label>在庫数</label><input id="stock" type="number" min="0" value="3">
<button class="primary" id="savePrize">景品を追加・更新</button>
<p id="adminStatus"></p>
</div>
</section>
</main>

<script>
const initialPrizes=[
{name:"S賞♡",probability:5,stock:3},
{name:"A賞✧",probability:20,stock:10},
{name:"B賞☆",probability:35,stock:20},
{name:"参加賞",probability:40,stock:100}
];
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let prizes=get("mic_prizes",initialPrizes);
let scratched=false,drawing=false,last=null;
const canvas=document.getElementById("cover"),ctx=canvas.getContext("2d");

document.querySelectorAll("nav button").forEach(b=>{
b.addEventListener("click",()=>{
document.querySelectorAll(".page").forEach(p=>p.classList.toggle("hidden",p.id!==b.dataset.page));
document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));
if(b.dataset.page==="prizes")renderPrizes();
if(b.dataset.page==="history")renderHistory();
});
});

function renderPrizes(){
const box=document.getElementById("prizeList");box.replaceChildren();
prizes.forEach(p=>{
const d=document.createElement("div");d.className="prize";
d.textContent=`${p.name}　確率 ${p.probability}%　残り ${p.stock}`;
box.appendChild(d);
});
}
function renderHistory(){
const box=document.getElementById("historyList");box.replaceChildren();
const h=get("mic_history",[]);
if(!h.length){box.textContent="まだ履歴はありません ♡";return}
h.slice().reverse().forEach(x=>{
const d=document.createElement("p");
d.textContent=`${x.date}　${x.nickname}：${x.result}`;
box.appendChild(d);
});
}
function resize(){
const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;
canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);
ctx.setTransform(d,0,0,d,0,0);
const g=ctx.createLinearGradient(0,0,r.width,r.height);
g.addColorStop(0,"#bcbcc6");g.addColorStop(.5,"#f8f8fc");g.addColorStop(1,"#aaaab8");
ctx.globalCompositeOperation="source-over";ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);
ctx.fillStyle="#777";ctx.textAlign="center";ctx.font="bold 22px sans-serif";
ctx.fillText("✧ SCRATCH ✧",r.width/2,r.height/2);
ctx.font="14px sans-serif";ctx.fillText("ここをこすってね ♡",r.width/2,r.height/2+25);
ctx.globalCompositeOperation="destination-out";
}
function erase(e){
const r=canvas.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};
ctx.globalCompositeOperation="destination-out";ctx.lineWidth=38;ctx.lineCap="round";
ctx.beginPath();
if(last){ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke()}
else{ctx.arc(p.x,p.y,19,0,Math.PI*2);ctx.fill()}
last=p;
}
canvas.addEventListener("pointerdown",e=>{
if(scratched)return;drawing=true;last=null;canvas.setPointerCapture(e.pointerId);erase(e);e.preventDefault();
});
canvas.addEventListener("pointermove",e=>{if(drawing){erase(e);e.preventDefault()}});
function stop(){
if(!drawing)return;drawing=false;last=null;
const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
let clear=0;for(let i=3;i<pixels.length;i+=4)if(pixels[i]<40)clear++;
if(clear/(pixels.length/4)>.4)finishScratch();
}
canvas.addEventListener("pointerup",stop);canvas.addEventListener("pointercancel",stop);

function finishScratch(){
if(scratched)return;scratched=true;canvas.style.display="none";
const available=prizes.filter(p=>p.stock>0&&p.probability>0);
let prize={name:"参加賞",stock:0};
if(available.length){
let total=available.reduce((s,p)=>s+Number(p.probability),0),n=Math.random()*total;
for(const p of available){n-=Number(p.probability);if(n<0){prize=p;break}}
prize.stock=Math.max(0,Number(prize.stock)-1);
put("mic_prizes",prizes);
}
document.getElementById("result").textContent=prize.name;
document.getElementById("sub").textContent="スクラッチ完了 ♡";
document.getElementById("status").textContent="デモ結果を表示したよ ♡";
const h=get("mic_history",[]);
h.push({date:new Date().toLocaleString("ja-JP"),nickname:document.getElementById("nickname").value.trim()||"ゲスト",result:prize.name});
put("mic_history",h);renderHistory();renderPrizes();
}
document.getElementById("reset").onclick=()=>{
scratched=false;canvas.style.display="block";
document.getElementById("result").textContent="こすってね ♡";
document.getElementById("sub").textContent="指で銀色の部分を削ってね";
document.getElementById("status").textContent="準備できたよ ♡";resize();
};
document.getElementById("send").onclick=()=>{
document.getElementById("contactStatus").textContent="お問い合わせ送信はまだ未接続です。";
};
document.getElementById("savePrize").onclick=()=>{
const name=document.getElementById("pname").value.trim();
const probability=Number(document.getElementById("prob").value),stock=Number(document.getElementById("stock").value);
if(!name||probability<0||probability>100||stock<0){document.getElementById("adminStatus").textContent="入力内容を確認してね";return}
const old=prizes.find(p=>p.name===name);
if(old){old.probability=probability;old.stock=stock}else prizes.push({name,probability,stock});
put("mic_prizes",prizes);renderPrizes();
document.getElementById("adminStatus").textContent="この端末の景品一覧を更新したよ";
};
renderPrizes();renderHistory();resize();
window.addEventListener("resize",()=>{if(!scratched)resize()});
</script>
</body>
</html>
