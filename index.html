<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY IDOL CLUB ♡</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: sans-serif;
  color: #70445d;
  background: linear-gradient(180deg, #fff0f7, #fffafd);
}
header {
  padding: 25px 15px;
  text-align: center;
  background: #ffb8d8;
  border-bottom: 5px solid #ffe1ee;
}
h1 { margin: 0; font-size: 28px; }
header p { margin-bottom: 0; }
main { max-width: 560px; margin: auto; padding: 18px; }
.card {
  background: white;
  border: 2px solid #ffd2e5;
  border-radius: 22px;
  padding: 20px;
  margin: 16px 0;
  box-shadow: 0 5px 15px #e9a9c522;
}
h2 { color: #e76ba2; margin-top: 0; }
input {
  width: 100%;
  padding: 13px;
  border: 2px solid #ffc6df;
  border-radius: 12px;
  font-size: 16px;
  margin: 8px 0;
}
button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 14px;
  background: #f17eaf;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 8px;
  cursor: pointer;
}
button:active { transform: scale(.98); }
.prize {
  padding: 12px;
  margin: 9px 0;
  background: #fff1f7;
  border-radius: 12px;
}
#result {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-top: 15px;
}
footer { text-align: center; padding: 25px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>🎀 MY IDOL CLUB ♡</h1>
  <p>KAWAII SCRATCH CLUB ✧ FREE DEMO</p>
</header>

<main>
  <section class="card">
    <h2>💗 はじめまして！</h2>
    <p>ニックネームを入力して、アイドルクラブに参加しよう♡</p>
    <p>※ デモ用です。本名やパスワードは入力しないでね。</p>
    <input id="nickname" maxlength="20" placeholder="ニックネーム">
    <button onclick="joinClub()">ログインして遊ぶ ♡</button>
    <p id="welcome"></p>
  </section>

  <section class="card">
    <h2>💎 景品ラインナップ</h2>
    <div class="prize">💖 SUPER STAR — スペシャル賞</div>
    <div class="prize">🩵 BLUE HEART — ハート賞</div>
    <div class="prize">🎀 PINK RIBBON — リボン賞</div>
    <div class="prize">🍬 SWEET CANDY — キャンディ賞</div>
    <p>※ 景品はデモ用の表示です。</p>
  </section>

  <section class="card">
    <h2>🎁 おためしくじ</h2>
    <p>ボタンを押して、今日のラッキーアイテムを引こう！</p>
    <button onclick="drawFortune()">くじを引く ♡</button>
    <div id="result"></div>
  </section>
</main>

<footer>MY IDOL CLUB ♡ DEMO VERSION</footer>

<script>
function joinClub() {
  const name = document.getElementById('nickname').value.trim();
  const welcome = document.getElementById('welcome');
  if (!name) {
    welcome.textContent = 'ニックネームを入力してね 🎀';
    return;
  }
  welcome.textContent = name + ' ちゃん、ようこそ！♡';
}
function drawFortune() {
  const fortunes = [
    '💖 SUPER STAR！最高の運勢！',
    '🩵 BLUE HEART！幸せが訪れるかも！',
    '🎀 PINK RIBBON！かわいさアップ！',
    '🍬 SWEET CANDY！甘い幸運が待ってる！'
  ];
  const i = Math.floor(Math.random() * fortunes.length);
  document.getElementById('result').textContent = fortunes[i];
}
</script>
</body>
</html>
